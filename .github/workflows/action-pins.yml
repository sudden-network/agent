name: Action Pins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-pins:
    name: Verify immutable workflow dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install checksum-verified scanner
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes
          -r .github/requirements-action-pins.txt
      - name: Check composite Docker action digests
        run: |
          python -m unittest discover -s .github/scripts -p "test_composite_images.py"
          python .github/scripts/check_composite_images.py
      - name: Reject mutable action, reusable workflow, and image references
        shell: bash
        run: |
          set -euo pipefail
          zizmor --offline --no-config --no-ignores --persona=pedantic \
            --strict-collection --collect=workflows,actions --no-progress \
            --no-exit-codes --format=json-v1 . > "$RUNNER_TEMP/action-pins.json"
          jq '[.[] | select(.ident == "unpinned-uses" or .ident == "unpinned-images")]
            | .[] | .locations[] | select(.symbolic.kind == "Primary")
            | "\(.symbolic.key.Local.verbatim_path):\(.concrete.location.start_point.row + 1): \(.symbolic.annotation)"' \
            -r "$RUNNER_TEMP/action-pins.json"
          jq -e '[.[] | select(.ident == "unpinned-uses" or .ident == "unpinned-images")]
            | length == 0' "$RUNNER_TEMP/action-pins.json"
